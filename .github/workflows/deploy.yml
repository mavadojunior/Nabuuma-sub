name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .next
          retention-days: 1

  pre-deploy-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript check
        run: npm run typecheck
      
      - name: Run lint
        run: npm run lint
      
      - name: Run tests
        run: npm run test || true

  staging-deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ build, pre-deploy-checks ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .next
      
      - name: Deploy to Staging
        id: deploy
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --prod=false
          echo "deployment_url=https://staging.nabuuma.example.com" >> $GITHUB_OUTPUT
        env:
          DEPLOYMENT_KEY: ${{ secrets.STAGING_DEPLOYMENT_KEY }}
      
      - name: Verify Staging Deployment
        run: |
          echo "Verifying deployment..."
          # Add health check commands here
          curl -f ${{ steps.deploy.outputs.deployment_url }}/health || exit 1

  production-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ build, pre-deploy-checks ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .next
      
      - name: Create Production Release
        id: release
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"
      
      - name: Deploy to Production
        id: deploy
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --prod
          echo "deployment_url=https://nabuuma.example.com" >> $GITHUB_OUTPUT
        env:
          DEPLOYMENT_KEY: ${{ secrets.PRODUCTION_DEPLOYMENT_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      
      - name: Run Production Health Checks
        run: |
          echo "Running production health checks..."
          curl -f ${{ steps.deploy.outputs.deployment_url }}/health || exit 1
          curl -f ${{ steps.deploy.outputs.deployment_url }}/api/health || exit 1
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.version }}
          release_name: Release ${{ steps.release.outputs.version }}
          body: |
            Production deployment successful.
            - Deployment URL: ${{ steps.deploy.outputs.deployment_url }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false

  post-deploy:
    name: Post-Deployment Actions
    runs-on: ubuntu-latest
    needs: [ production-deploy ]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          payload: |
            {
              "text": "Nabuuma V3.5 Deployment ${{ needs.production-deploy.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*: ${{ needs.production-deploy.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}\n*Commit*: ${{ github.sha }}\n*Branch*: ${{ github.ref }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
      
      - name: Create deployment issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Failed: ${context.sha.substring(0, 7)}`,
              body: `Production deployment failed for commit ${context.sha}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deployment', 'urgent']
            })
